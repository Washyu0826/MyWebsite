<!-- The app loads these through next/font in the root layout, which never runs in Storybook, so the
     same three families are fetched here and bound to the variables tokens.css expects. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap"
/>
<style>
  :root {
    --font-inter: 'Inter';
    --font-noto: 'Noto Sans TC';
    --font-jetbrains: 'JetBrains Mono';
  }
  html,
  body {
    background: var(--paper);
  }
  /* Storybook's own canvas padding fights the site's spacing scale; the frame restores it. */
  body {
    margin: 0;
  }
  .story-frame {
    padding: 24px;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
  }
</style>
